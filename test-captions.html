<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rise Course Translate — Caption Test</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; color: #222; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    section { background: #fff; padding: 16px; margin: 0 0 24px; border-radius: 8px; }
    video { width: 100%; display: block; background: #000; }
    .player { position: relative; }
    .player-caption-window, .vjs-text-track-display {
      position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; pointer-events: none;
    }
    .player-caption-window span, .vjs-text-track-cue {
      background: rgba(0,0,0,.75); color: #fff; padding: 2px 8px; font-size: 18px;
    }
  </style>
  <script type="text/plain" id="rise-glossary" data-rise-glossary>
Source content,Target content,Notes (250 character max)
Digital Twin,Digital Twin,
  </script>
  <script src="risecoursetranslate.js" data-glossary="Translation Glossary.csv" defer></script>
</head>
<body>
<main>
  <h1>Caption translation test</h1>
  <p>Pick a language in the bar, then play each video. Captions should switch language. "Digital Twin" should stay in English.</p>

  <section>
    <h2>1. Native browser captions</h2>
    <video id="v1" controls muted playsinline src="test-captions.mp4">
      <track kind="captions" srclang="en" label="English" src="test-captions.vtt" default>
    </video>
  </section>

  <section>
    <h2>2. Player that draws cues itself</h2>
    <div class="player">
      <video id="v2" controls muted playsinline src="test-captions.mp4">
        <track kind="captions" srclang="en" label="English" src="test-captions.vtt">
      </video>
      <div class="player-caption-window" aria-live="polite"></div>
    </div>
  </section>

  <section>
    <h2>3. Player that reads the VTT file itself</h2>
    <div class="player vjs-player">
      <video id="v3" controls muted playsinline src="test-captions.mp4"></video>
      <div class="vjs-text-track-display"></div>
    </div>
  </section>
</main>
<script>
  // Player 2: hides the native track and renders activeCues into a div.
  (function () {
    var v = document.getElementById('v2');
    var out = document.querySelector('.player-caption-window');
    var tt = v.textTracks[0];
    tt.mode = 'hidden';
    tt.addEventListener('cuechange', function () {
      out.innerHTML = '';
      Array.prototype.forEach.call(tt.activeCues || [], function (c) {
        var s = document.createElement('span');
        s.textContent = c.text.replace(/<[^>]*>/g, '');
        out.appendChild(s);
      });
    });
  })();

  // Player 3: fetches and parses the VTT itself; no TextTrack at all.
  (function () {
    var v = document.getElementById('v3');
    var out = document.querySelector('.vjs-text-track-display');
    function t(s) { var p = s.split(':'); return (+p[0]) * 3600 + (+p[1]) * 60 + parseFloat(p[2]); }
    fetch('test-captions.vtt').then(function (r) { return r.text(); }).then(function (txt) {
      var cues = txt.split(/\n\n+/).map(function (b) {
        var lines = b.split('\n'), i = lines.findIndex(function (l) { return l.indexOf('-->') > -1; });
        if (i < 0) return null;
        var m = lines[i].split('-->');
        return { start: t(m[0].trim()), end: t(m[1].trim().split(' ')[0]), text: lines.slice(i + 1).join('\n').replace(/<[^>]*>/g, '') };
      }).filter(Boolean);
      var shown = null;
      v.addEventListener('timeupdate', function () {
        var c = cues.find(function (c) { return v.currentTime >= c.start && v.currentTime < c.end; }) || null;
        if (c === shown) return;
        shown = c;
        out.innerHTML = c ? '<div class="vjs-text-track-cue">' + c.text.replace(/</g, '&lt;') + '</div>' : '';
      });
    });
  })();
</script>
</body>
</html>
